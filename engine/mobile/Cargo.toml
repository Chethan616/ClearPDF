[package]
name = "artefact-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Artefact's engine on phones: a native library with Kotlin bindings (UniFFI); the Android app is in ../../android"

[lib]
name = "artefact"
# cdylib: the library the Android app loads; lib: the tests
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
pdfcraft-engine = { workspace = true }
pdfcraft-render = { workspace = true }
# the headless tool table (the same tools as the CLI and MCP), without the MCP server
pdfcraft-automation = { workspace = true }
serde_json = { workspace = true }
# Word documents (src/word.rs): WordCraft's engine, which re-exports its model, layout and renderer
wordcraft-engine = { workspace = true }
# PowerPoint presentations (src/slides.rs): DeckCraft's reader, model and slide renderer
deckcraft-model = { workspace = true }
deckcraft-pptx = { workspace = true }
deckcraft-render = { workspace = true }
# Excel workbooks (src/sheets.rs): GridCraft's engine
gridcraft-engine = { workspace = true }
gridcraft-xlsx = { workspace = true }
# Pictures (src/photo.rs): LightCraft's decoding, develop settings and pipeline
lightcraft-codecs = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-raster = { workspace = true }
kurbo = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# MPL-2.0, pure Rust. The exact version: the Kotlin bindings are generated by the same release
# (bindgen/, a workspace member sharing this lock file) and refuse to load against another one.
uniffi = { version = "=0.32.2", default-features = false }

# the engine's log in logcat (pure Rust; links the system's liblog)
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.15", default-features = false }
