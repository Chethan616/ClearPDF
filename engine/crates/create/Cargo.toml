[package]
name = "pdfcraft-create"
description = "Create PDFs: blank documents, from images, plain text and Office files (Word, Excel, PowerPoint, RTF)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-fonts = { workspace = true }
png = "0.18"
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg"] }
# Already in the graph through image; read directly for CMYK JPEG samples, which image converts to RGB.
zune-jpeg = "0.5"
thiserror = { workspace = true }
# Already in the graph through lopdf; used only to read plain-text files (decode_text).
encoding_rs = "0.8"
# Office files: zip entries are inflated with flate2 and their XML parsed with roxmltree (both
# already in the graph); hayro-interpret supplies the standard-14 glyph widths for layout.
flate2 = { workspace = true }
roxmltree = "0.20"
hayro-interpret = "0.7"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg"] }
hayro-syntax = { workspace = true }
