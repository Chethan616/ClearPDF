name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release variant
        # Three flavors (play, foss, fdroid) compile in one Kotlin daemon; its default 2 GB heap ran
        # out (GC overhead limit). The runner has 16 GB, so give Gradle and Kotlin 4 GB each.
        run: ./gradlew assembleRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: clearpdf-release-apk
          # Product flavors (foss / play) put APKs under apk/<flavor>/release/.
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
