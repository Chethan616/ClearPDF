# Checks for every pull request and every push to main: the engine's bridge is linted and tested,
# and the app is built (a debug APK, kept as the run's artifact) and its unit tests run. A pull
# request from a fork runs with no secrets: nothing here needs any.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer push to the same pull request replaces the run in progress
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  engine:
    name: Engine (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # the Rust release rust-toolchain.toml names
      - name: Install Rust
        working-directory: engine
        run: rustup toolchain install && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-engine
          workspaces: engine -> target

      - name: Format
        working-directory: engine
        run: cargo fmt -p artefact-mobile -- --check

      - name: Lint
        working-directory: engine
        run: cargo clippy -p artefact-mobile --all-targets --locked -- -D warnings

      - name: Test
        working-directory: engine
        run: cargo test -p artefact-mobile --locked

  app:
    name: App (Android)
    # Ubuntu's hosted image includes the Gradle version the release workflow pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        working-directory: engine
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-android
          workspaces: engine -> target

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      # one ABI is enough to prove the app builds (x86_64: the emulator's)
      - name: Build and unit-test
        working-directory: android
        run: gradle assembleDebug testDebugUnitTest -Partefact.abis=x86_64 --no-daemon --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
